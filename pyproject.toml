[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medrag"
version = "0.1.0"
description = "A local, cited medical-information RAG assistant"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.35"]
llm = ["anthropic>=0.30"]
dev = ["pytest>=8"]

[project.scripts]
medrag = "medrag.cli:main"

[tool.setuptools.packages.find]
include = ["medrag*"]

